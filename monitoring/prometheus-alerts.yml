groups:
  - name: patroni-ha
    rules:
      - alert: NoClusterLeader
        expr: count(patroni_primary == 1) == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "No Patroni leader elected for >1m"

      - alert: NodeDown
        expr: up{job=~"patroni|postgres-exporters"} == 0
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.job }} target {{ $labels.instance }} down"

      - alert: ReplicationLagHigh
        expr: (max(patroni_xlog_location) - on(instance) patroni_xlog_replay_location) > 67108864
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.instance }} replication lag > 64MB"

      - alert: WALArchiveFailing
        expr: increase(pg_stat_archiver_failed_count[10m]) > 0
        for: 0m
        labels: {severity: critical}
        annotations:
          summary: "WAL archive failures on {{ $labels.instance }} — backups/PITR at risk"

      - alert: WALArchiveStale
        expr: pg_stat_archiver_since_last_archived_seconds > 600
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "No WAL archived in >10min on {{ $labels.instance }}"

      - alert: PostgresRestarted
        expr: pg_process_uptime_seconds < 300
        for: 0m
        labels: {severity: info}
        annotations:
          summary: "PostgreSQL restarted on {{ $labels.instance }}"

      - alert: TooManyConnections
        expr: pg_activity_connections / pg_activity_max_connections > 0.85
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: ">85% of max_connections used on {{ $labels.instance }}"

  - name: host-resources
    rules:
      - alert: HostDiskAlmostFull
        expr: node_filesystem_avail_bytes{mountpoint="/host",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{mountpoint="/host",fstype!~"tmpfs|overlay"} < 0.15
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "Host filesystem {{ $labels.device }} <15% free"

      - alert: LongRunningTransaction
        expr: pg_transactions_longest_tx_seconds > 900
        for: 0m
        labels: {severity: warning}
        annotations:
          summary: "Transaction running >15min on {{ $labels.instance }}"

      - alert: IdleInTransactionLeak
        expr: pg_transactions_idle_in_tx_count > 5 and pg_transactions_longest_idle_in_tx_seconds > 600
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.instance }} idle-in-transaction leak (>5 sessions, oldest >10min)"

      - alert: WaitingBackends
        expr: pg_transactions_waiting_backends > 4
        for: 3m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.instance }} has {{ $value }} backends waiting on locks"

      - alert: ReplicationSlotRetainedWAL
        expr: max(pg_replication_slots_pg_wal_lsn_diff) / 1024 / 1024 / 1024 > 2
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "A replication slot is retaining >2GB of WAL"
