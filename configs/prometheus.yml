# Rendered by scripts/generate_configs.sh → configs/prometheus.yml
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: patroni
    static_configs:
      - targets: ["db1:8001"]
        labels:
          node: db1
      - targets: ["db2:8001"]
        labels:
          node: db2
      - targets: ["db3:8001"]
        labels:
          node: db3

  - job_name: postgres-exporters
    static_configs:
      - targets:
        - "postgres-exporter-db1:9187"
        - "postgres-exporter-db2:9187"
        - "postgres-exporter-db3:9187"
    metric_relabel_configs:
      # unify instance identity with the patroni job so dashboards can
      # switch between exporter and patroni metrics for the same node
      - source_labels: [instance]
        regex: postgres-exporter-(db[0-9]+):9187
        target_label: instance
        replacement: ${1}:8001

  - job_name: haproxy
    static_configs:
      - targets: ["haproxy-exporter:9101"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
